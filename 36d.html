<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#09090d" />
  <meta
    name="description"
    content="BLOOM — cinematic procedural 3D rose experience"
  />
  <title>BLOOM — A Rose Awakens</title>

  <style>
    /* =========================================================
       BLOOM DESIGN SYSTEM
       ---------------------------------------------------------
       CODEGRAPH
       Scene
       ├── Atmosphere
       │   ├── Sky
       │   ├── Clouds
       │   ├── Fog
       │   └── Mist
       │
       ├── Environment
       │   ├── Ground
       │   ├── Grass
       │   └── Particles
       │
       ├── Rose
       │   ├── Stem
       │   ├── Leaves
       │   ├── Bud
       │   ├── Outer Petals
       │   ├── Middle Petals
       │   ├── Inner Petals
       │   ├── Core
       │   └── Dew
       │
       ├── Motion
       │   ├── Wind Field
       │   ├── Bloom Timeline
       │   ├── Camera Journey
       │   └── Micro Motion
       │
       └── Presentation
           ├── Tone Mapping
           ├── Bloom
           ├── DOF
           └── Minimal UI

       State
       ├── progress
       ├── cameraProgress
       ├── bloomProgress
       ├── wind
       ├── pointer
       └── quality

       Data Flow
       Scroll/Autoplay
           ↓
       targetProgress
           ↓
       damped progress
           ↓
       Camera + Bloom + Sky
           ↓
       Wind/Lighting/Atmosphere
           ↓
       Render

       Failure Paths
       ├── WebGL unavailable
       ├── CDN/module failure
       ├── low-end/mobile device
       └── reduced-motion preference
    ========================================================== */

    :root {
      --bg: #09090d;
      --paper: #f4eee9;
      --soft: rgba(244, 238, 233, 0.72);
      --muted: rgba(244, 238, 233, 0.38);
      --line: rgba(244, 238, 233, 0.13);

      --ease-cinema: cubic-bezier(0.22, 0.61, 0.36, 1);
      --ease-soft: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      overflow-x: hidden;
      color: var(--paper);
      font-family:
        "Iowan Old Style",
        "Palatino Linotype",
        Palatino,
        Georgia,
        serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body.loading {
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    canvas {
      display: block;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #scroll-space {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 600vh;
      pointer-events: none;
    }

    /* =========================================================
       LOADING
    ========================================================== */

    #loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;

      background:
        radial-gradient(
          circle at 50% 62%,
          rgba(109, 47, 73, 0.12),
          transparent 34%
        ),
        #09090d;

      transition:
        opacity 1.15s var(--ease-cinema),
        visibility 1.15s;
    }

    #loader.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-inner {
      width: min(390px, 76vw);
      text-align: center;
    }

    .loader-title {
      font-size: clamp(42px, 9vw, 76px);
      line-height: 0.92;
      font-weight: 400;
      letter-spacing: 0.28em;
      margin-left: 0.28em;
    }

    .loader-track {
      width: 100%;
      height: 1px;
      margin-top: 30px;
      overflow: hidden;
      background: rgba(255,255,255,0.11);
    }

    .loader-bar {
      width: 0;
      height: 100%;
      transform-origin: left center;

      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,.15),
          rgba(255,210,216,.82),
          rgba(255,255,255,.18)
        );
    }

    .loader-label {
      margin-top: 15px;
      color: var(--muted);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;

      font-size: 9px;
      line-height: 1;
      letter-spacing: .23em;
      text-transform: uppercase;
    }

    .loader-percent {
      margin-top: 10px;
      color: rgba(255,255,255,.23);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;

      font-size: 9px;
      letter-spacing: .16em;
    }

    /* =========================================================
       MINIMAL UI
    ========================================================== */

    #ui {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    .brand {
      position: absolute;
      top: max(23px, env(safe-area-inset-top));
      left: max(24px, env(safe-area-inset-left));

      color: rgba(255,255,255,.82);
      font-size: 14px;
      letter-spacing: .34em;
      margin-left: .34em;

      user-select: none;
    }

    .progress {
      position: absolute;
      top: max(23px, env(safe-area-inset-top));
      right: max(24px, env(safe-area-inset-right));

      color: rgba(255,255,255,.37);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;

      font-size: 9px;
      letter-spacing: .18em;

      user-select: none;
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: calc(max(24px, env(safe-area-inset-bottom)) + 48px);

      transform: translateX(-50%);

      color: rgba(255,255,255,.3);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;

      font-size: 8px;
      letter-spacing: .23em;
      text-transform: uppercase;

      white-space: nowrap;

      transition:
        opacity .8s var(--ease-cinema);
    }

    .hint.hidden {
      opacity: 0;
    }

    .replay {
      position: absolute;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));

      transform: translateX(-50%);

      pointer-events: auto;

      appearance: none;

      border: 1px solid var(--line);
      border-radius: 999px;

      background: rgba(8,8,13,.18);

      color: rgba(255,255,255,.72);

      padding: 9px 16px;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;

      font-size: 9px;
      letter-spacing: .19em;
      line-height: 1;
      text-transform: uppercase;

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      cursor: pointer;

      transition:
        background .3s ease,
        border-color .3s ease,
        transform .3s ease,
        color .3s ease;
    }

    .replay:hover {
      background: rgba(255,255,255,.055);
      border-color: rgba(255,255,255,.28);
      color: rgba(255,255,255,.95);

      transform:
        translateX(-50%)
        translateY(-2px);
    }

    .replay:focus-visible {
      outline: 1px solid rgba(255,255,255,.55);
      outline-offset: 4px;
    }

    /* =========================================================
       FALLBACK
    ========================================================== */

    #fallback {
      position: fixed;
      inset: 0;
      z-index: 500;

      display: none;
      place-items: center;

      padding: 32px;

      background: #09090d;

      text-align: center;
    }

    #fallback.show {
      display: grid;
    }

    .fallback-title {
      margin: 0 0 15px;

      font-size: 48px;
      font-weight: 400;
    }

    .fallback-copy {
      max-width: 470px;
      margin: 0 auto;

      color: rgba(255,255,255,.47);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;

      font-size: 14px;
      line-height: 1.8;
    }

    @media (max-width: 700px) {
      .brand {
        font-size: 13px;
      }

      .progress {
        font-size: 8px;
      }

      .hint {
        font-size: 7px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #scroll-space {
        height: 170vh;
      }

      * {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body class="loading">

  <canvas id="stage"></canvas>

  <div id="scroll-space"></div>

  <!-- =========================================================
       LOADING SCREEN
  ========================================================== -->

  <div id="loader">
    <div class="loader-inner">

      <div class="loader-title">
        BLOOM
      </div>

      <div class="loader-track">
        <div
          id="loader-bar"
          class="loader-bar"
        ></div>
      </div>

      <div
        id="loader-label"
        class="loader-label"
      >
        preparing the garden
      </div>

      <div
        id="loader-percent"
        class="loader-percent"
      >
        0%
      </div>

    </div>
  </div>

  <!-- =========================================================
       UI
  ========================================================== -->

  <div id="ui">

    <div class="brand">
      BLOOM
    </div>

    <div
      id="progress"
      class="progress"
    >
      00%
    </div>

    <div
      id="hint"
      class="hint"
    >
      scroll into the garden
    </div>

    <button
      id="replay"
      class="replay"
      type="button"
    >
      replay
    </button>

  </div>

  <!-- =========================================================
       FALLBACK
  ========================================================== -->

  <div id="fallback">

    <div>

      <h1 class="fallback-title">
        BLOOM
      </h1>

      <p class="fallback-copy">
        Trình duyệt hiện tại không cung cấp WebGL cần thiết cho
        trải nghiệm 3D này. Hãy thử Chrome, Edge, Firefox hoặc
        Safari bản mới.
      </p>

    </div>

  </div>

  <!-- =========================================================
       THREE.JS
  ========================================================== -->

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">

    import * as THREE from "three";

    import {
      EffectComposer
    } from "three/addons/postprocessing/EffectComposer.js";

    import {
      RenderPass
    } from "three/addons/postprocessing/RenderPass.js";

    import {
      UnrealBloomPass
    } from "three/addons/postprocessing/UnrealBloomPass.js";

    import {
      BokehPass
    } from "three/addons/postprocessing/BokehPass.js";

    import {
      OutputPass
    } from "three/addons/postprocessing/OutputPass.js";


    /* =========================================================
       DOM REFERENCES
    ========================================================== */

    const DOM = {

      canvas:
        document.getElementById(
          "stage"
        ),

      loader:
        document.getElementById(
          "loader"
        ),

      loaderBar:
        document.getElementById(
          "loader-bar"
        ),

      loaderLabel:
        document.getElementById(
          "loader-label"
        ),

      loaderPercent:
        document.getElementById(
          "loader-percent"
        ),

      progress:
        document.getElementById(
          "progress"
        ),

      hint:
        document.getElementById(
          "hint"
        ),

      replay:
        document.getElementById(
          "replay"
        ),

      fallback:
        document.getElementById(
          "fallback"
        )
    };


    /* =========================================================
       QUALITY SYSTEM
    ========================================================== */

    function detectQuality() {

      const mobile =
        /Android|iPhone|iPad|iPod/i.test(
          navigator.userAgent
        );

      const cores =
        navigator.hardwareConcurrency || 4;

      let tier = "high";

      if (
        mobile ||
        cores <= 4
      ) {
        tier = "medium";
      }

      if (
        mobile &&
        cores <= 4
      ) {
        tier = "low";
      }

      return {

        tier,

        mobile,

        dpr:
          tier === "high"
            ? Math.min(
                window.devicePixelRatio || 1,
                2
              )
            : tier === "medium"
              ? Math.min(
                  window.devicePixelRatio || 1,
                  1.5
                )
              : 1,

        pollen:
          tier === "high"
            ? 900
            : tier === "medium"
              ? 520
              : 280,

        dust:
          tier === "high"
            ? 300
            : tier === "medium"
              ? 170
              : 90,

        grass:
          tier === "high"
            ? 1100
            : tier === "medium"
              ? 650
              : 300,

        terrain:
          tier === "high"
            ? 72
            : tier === "medium"
              ? 52
              : 36,

        shadow:
          tier === "high"
            ? 2048
            : tier === "medium"
              ? 1024
              : 512,

        post:
          tier !== "low",

        antialias:
          tier !== "low"
      };
    }

    const QUALITY =
      detectQuality();

    const REDUCED_MOTION =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;


    /* =========================================================
       WEBGL SUPPORT
    ========================================================== */

    function supportsWebGL() {

      try {

        const test =
          document.createElement(
            "canvas"
          );

        return Boolean(
          test.getContext("webgl2") ||
          test.getContext("webgl")
        );

      } catch {

        return false;

      }
    }

    if (
      !supportsWebGL()
    ) {

      DOM.fallback.classList.add(
        "show"
      );

      document.body.classList.remove(
        "loading"
      );

      throw new Error(
        "WebGL unavailable"
      );
    }


    /* =========================================================
       APP STATE
    ========================================================== */

    const STATE = {

      time: 0,

      delta: 0,

      progress: 0,

      targetProgress: 0,

      cameraProgress: 0,

      bloomProgress: 0,

      windStrength: 0.15,

      autoPlay: true,

      lastInteraction:
        performance.now(),

      pointer:
        new THREE.Vector2(),

      pointerTarget:
        new THREE.Vector2(),

      orbit:
        new THREE.Vector2(),

      pointerDown:
        new THREE.Vector2(),

      mouseDown: false,

      cameraPosition:
        new THREE.Vector3(),

      cameraLook:
        new THREE.Vector3(),

      smoothLook:
        new THREE.Vector3()
    };


    /* =========================================================
       MATH
    ========================================================== */

    const clamp01 =
      value =>
        THREE.MathUtils.clamp(
          value,
          0,
          1
        );


    function smoothstep(value) {

      const t =
        clamp01(
          value
        );

      return (
        t *
        t *
        t *
        (
          t *
            (t * 6 - 15) +
          10
        )
      );
    }


    function easeInOut(value) {

      const t =
        clamp01(
          value
        );

      return t < .5

        ? 4 *
          t *
          t *
          t

        : 1 -
          Math.pow(
            -2 *
              t +
              2,
            3
          ) /
          2;
    }


    function easeOut(value) {

      const t =
        clamp01(
          value
        );

      return (
        1 -
        Math.pow(
          1 - t,
          5
        )
      );
    }


    function range(
      value,
      start,
      end
    ) {

      return smoothstep(
        (
          value -
          start
        ) /
        (
          end -
          start
        )
      );
    }


    function damp(
      current,
      target,
      smoothing,
      dt
    ) {

      return THREE.MathUtils.damp(
        current,
        target,
        smoothing,
        dt
      );
    }


    /* =========================================================
       DETERMINISTIC NOISE
    ========================================================== */

    function hash(
      x,
      y
    ) {

      const n =
        Math.sin(
          x * 127.1 +
          y * 311.7
        ) *
        43758.5453123;

      return (
        n -
        Math.floor(n)
      );
    }


    function noise1D(x) {

      const integer =
        Math.floor(x);

      const fraction =
        x -
        integer;

      const interpolation =
        fraction *
        fraction *
        (
          3 -
          2 *
          fraction
        );

      const a =
        hash(
          integer,
          17.13
        );

      const b =
        hash(
          integer + 1,
          17.13
        );

      return (
        THREE.MathUtils.lerp(
          a,
          b,
          interpolation
        ) *
        2 -
        1
      );
    }


    function fbm(x) {

      let total = 0;

      let amplitude = .5;

      let frequency = 1;

      for (
        let i = 0;
        i < 4;
        i++
      ) {

        total +=
          noise1D(
            x *
            frequency
          ) *
          amplitude;

        frequency *= 2;
        amplitude *= .5;
      }

      return total;
    }


    /* =========================================================
       RENDER STATE
    ========================================================== */

    const ENGINE = {

      renderer: null,

      composer: null,

      renderPass: null,

      bloomPass: null,

      bokehPass: null,

      outputPass: null,

      scene: null,

      camera: null
    };


    /* =========================================================
       WORLD STATE
    ========================================================== */

    const WORLD = {

      sky: null,

      horizon: null,

      cloudGroup: null,

      mistGroup: null,

      ground: null,

      grassGroup: null,

      stemGroup: null,

      stem: null,

      rose: null,

      bud: null,

      core: null,

      keyLight: null,

      fillLight: null,

      rimLight: null,

      ambientLight: null,

      bounceLight: null,

      pollen: null,

      dust: null
    };


    /* =========================================================
       COLLECTIONS
    ========================================================== */

    const ROSE = {

      petals: [],

      leaves: [],

      dew: [],

      falling: []

    };


    /* =========================================================
       CLOCK
    ========================================================== */

    const clock =
      new THREE.Clock();


    /* =========================================================
       LOADING CONTROLLER
    ========================================================== */

    const LOADER = {

      value: 0,

      target: 0,

      label:
        "preparing the garden",

      active: true

    };


    function setLoading(
      value,
      label
    ) {

      LOADER.target =
        clamp01(
          value
        ) *
        100;

      if (
        label
      ) {
        LOADER.label =
          label;
      }
    }


    function renderLoading() {

      LOADER.value =
        damp(
          LOADER.value,
          LOADER.target,
          5.5,
          .016
        );

      const rounded =
        Math.round(
          LOADER.value
        );

      DOM.loaderBar.style.width =
        rounded +
        "%";

      DOM.loaderPercent.textContent =
        rounded +
        "%";

      DOM.loaderLabel.textContent =
        LOADER.label;

      if (
        LOADER.active
      ) {
        requestAnimationFrame(
          renderLoading
        );
      }

    }


    function finishLoading() {

      LOADER.target =
        100;

      setTimeout(
        () => {

          LOADER.active =
            false;

          DOM.loader.classList.add(
            "done"
          );

          document.body.classList.remove(
            "loading"
          );

        },
        420
      );
    }


    /* =========================================================
       RENDERER
    ========================================================== */

    function initRenderer() {

      ENGINE.renderer =
        new THREE.WebGLRenderer({

          canvas:
            DOM.canvas,

          antialias:
            QUALITY.antialias,

          alpha:
            false,

          powerPreference:
            "high-performance"
        });

      ENGINE.renderer.setPixelRatio(
        QUALITY.dpr
      );

      ENGINE.renderer.setSize(
        window.innerWidth,
        window.innerHeight,
        false
      );

      ENGINE.renderer.shadowMap.enabled =
        true;

      ENGINE.renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

      ENGINE.renderer.outputColorSpace =
        THREE.SRGBColorSpace;

      ENGINE.renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

      ENGINE.renderer.toneMappingExposure =
        1.02;

      setLoading(
        .10,
        "initializing the renderer"
      );
    }


    /* =========================================================
       SCENE
    ========================================================== */

    function initScene() {

      ENGINE.scene =
        new THREE.Scene();

      ENGINE.scene.fog =
        new THREE.FogExp2(
          new THREE.Color(
            "#101522"
          ),
          .0155
        );

      ENGINE.camera =
        new THREE.PerspectiveCamera(

          43,

          window.innerWidth /
          window.innerHeight,

          .05,

          180
        );

      ENGINE.camera.position.set(
        0,
        5.7,
        49
      );

      STATE.smoothLook.set(
        0,
        2.2,
        0
      );

      setLoading(
        .15,
        "building the scene"
      );
    }


    /* =========================================================
       SKY
    ========================================================== */

    function initSky() {

      const geometry =
        new THREE.SphereGeometry(
          120,
          48,
          32
        );

      const material =
        new THREE.ShaderMaterial({

          side:
            THREE.BackSide,

          depthWrite:
            false,

          uniforms: {

            topColor: {
              value:
                new THREE.Color(
                  "#06101e"
                )
            },

            middleColor: {
              value:
                new THREE.Color(
                  "#25364f"
                )
            },

            horizonColor: {
              value:
                new THREE.Color(
                  "#6a5165"
                )
            },

            horizonGlow: {
              value:
                .3
            },

            time: {
              value:
                0
            }
          },

          vertexShader: `

            varying vec3 vWorldPosition;

            void main() {

              vec4 world =
                modelMatrix *
                vec4(
                  position,
                  1.0
                );

              vWorldPosition =
                world.xyz;

              gl_Position =
                projectionMatrix *
                viewMatrix *
                world;
            }
          `,

          fragmentShader: `

            uniform vec3 topColor;
            uniform vec3 middleColor;
            uniform vec3 horizonColor;
            uniform float horizonGlow;
            uniform float time;

            varying vec3 vWorldPosition;

            void main() {

              vec3 direction =
                normalize(
                  vWorldPosition
                );

              float h =
                clamp(
                  direction.y *
                  .5 +
                  .5,
                  0.0,
                  1.0
                );

              vec3 lower =
                mix(
                  horizonColor,
                  middleColor,
                  smoothstep(
                    0.0,
                    .48,
                    h
                  )
                );

              vec3 finalColor =
                mix(
                  lower,
                  topColor,
                  smoothstep(
                    .47,
                    1.0,
                    h
                  )
                );

              float warm =
                exp(
                  -pow(
                    (
                      h -
                      .10
                    ) /
                    .13,
                    2.0
                  )
                );

              finalColor +=
                vec3(
                  1.0,
                  .36,
                  .23
                ) *
                warm *
                horizonGlow *

      for (
        let i = 0;
        i < count;
        i++
      ) {

        const cluster =
          new THREE.Group();

        const pieces =
          3 +
          (
            i % 4
          );

        for (
          let p = 0;
          p < pieces;
          p++
        ) {

          const sprite =
            new THREE.Sprite(

              new THREE.SpriteMaterial({

                map:
                  CLOUD_TEXTURE,

                color:
                  "#b7b9c8",

                transparent:
                  true,

                opacity:
                  .025 +
                  (
                    i % 4
                  ) *
                  .008,

                depthWrite:
                  false
              })
            );

          sprite.position.set(
            (
              p -
              pieces *
              .5
            ) * 2.1,

            Math.sin(
              p *
              1.7 +
              i
            ) *
            .45,

            0
          );

          const size =
            5 +
            (
              p % 3
            ) *
            1.9;

          sprite.scale.set(
            size *
            1.75,

            size *
            .63,

            1

          cluster.add(
            sprite

        cluster.position.set(

          (
            i % 7 -
            3

          9,

          9 +
            (
              i % 5
            ) *
            2.5,

          -42 -
            (
              i % 6
            ) *
            7
        );

        cluster.rotation.z =
          (

        cluster.userData = {

    function createParticleSystem(

      const positions =
        new Float32Array(
          count *
          3
        );

      const velocities =
        new Float32Array(
          count *
          3
        );

      const phase =
        new Float32Array(
          count
        );

      for (
        let i = 0;
        i < count;
        i++
      ) {

        const i3 =
          i *
          3;

        positions[i3] =
          (
            hash(
              i,
              1
            ) *
            2 -
            1
          ) *
          17;

        positions[i3 + 1] =
          .4 +
          hash(
            i,
            2
          ) *
          13;

        positions[i3 + 2] =
          (
            hash(
              i,
              3
            ) *
            2 -
            1
          ) *
          30;

        velocities[i3] =
          (
            hash(
              i,
              4
            ) *
            2 -
            1
          ) *
          .009;

        velocities[i3 + 1] =
          (
            hash(
              i,
              5
            ) *
            2 -
            1
          ) *
          .004;

        velocities[i3 + 2] =
          (
            hash(
              i,
              6
            ) *
            2 -
            1
          ) *
          .009;

        phase[i] =
          hash(
            i,
            7
          ) *
          Math.PI *
          2;
      }

      const geometry =
        new THREE.BufferGeometry();

      geometry.setAttribute(

        "position",

        new THREE.BufferAttribute(
          positions,
          3
        )

      );

      const material =
        new THREE.PointsMaterial({

          map:
            PARTICLE_TEXTURE,

          size:
            type === "dust"

              : .13,

            type === "dust"

          transparent:
            true,

          opacity:
            type === "dust"
              ? .25
              : .65,

          depthWrite:
            false,

          blending:
            THREE.AdditiveBlending,

          sizeAttenuation:
            true
        });

      const points =
        new THREE.Points(
          geometry,
          material
        );

      ENGINE.scene.add(
        points
      );

      return {

        points,

        positions,

        velocities,

        phase,

        count,

        type,

        material
      };
    }

    function updateWind(
      dt
    ) {

      WIND.phase +=
        dt;

      const slow =
        fbm(
          WIND.phase *
          .045
        );

      const medium =
        fbm(
          WIND.phase *
          .13 +
          11.3
        );

      const rhythmic =
        Math.sin(
          WIND.phase *
          .052 +
          1.6
        ) *
        .5 +
        .5;

      WIND.gustTarget =
        Math.pow(
          rhythmic,
          8
        ) *
        .68

        +

        Math.max(
          0,
          slow
        ) *
        .12;

      if (
        Math.random() <
        dt *
        .03
      ) {

        WIND.gustTarget =
          Math.max(
            WIND.gustTarget,
            .5 +
            Math.random() *
            .25
          );
      }

      WIND.gust =
        damp(
          WIND.gust,
          WIND.gustTarget,
          1.15,
          dt
        );

      const angle =
        .12 +

        noise1D(
          WIND.phase *
          .06
        ) *
        .08 +

        medium *
        .03;

      WIND.direction.set(

        Math.cos(angle),

        0,

        Math.sin(angle)

      ).normalize();

      STATE.windStrength =
        .12 +
        WIND.gust *
        .82 +
        Math.max(
          0,
          slow
        ) *
        .08;

      WIND.vector
        .copy(
          WIND.direction
        )
        .multiplyScalar(
          STATE.windStrength
        );
    }

    /* =========================================================
       PETAL GEOMETRY
    ========================================================== */

    function createPetalGeometry(
      options = {}
    ) {

      const {

        width = 1,

        height = 1.3,

        curvature = .3,

        thickness = .035,

        horizontalSegments =
          QUALITY.tier === "low"
            ? 7
            : 10,

        verticalSegments =
          QUALITY.tier === "low"
            ? 10
            : 14

      } = options;

      const positions = [];
      const uvs = [];
      const indices = [];

      for (
        let y = 0;
        y <= verticalSegments;
        y++
      ) {

        const v =
          y /
          verticalSegments;

        for (
          let x = 0;
          x <= horizontalSegments;
          x++
        ) {

          const u =
            x /
            horizontalSegments;

          const centered =
            u *
            2 -
            1;

          const crown =
            1 -
            centered *
            centered;

          const edge =
            Math.pow(
              crown,
              .34
            );

          const taper =
            .34 +
            edge *
            .74;

          const px =
            centered *
            width *
            .5 *
            taper *
            (
              .88 +
              .12 *
              Math.sin(
                v *
                Math.PI
              )
            );

          let py =
            v *
            height;

          const fold =
            Math.sin(
              v *
              Math.PI *
              1.3
            ) *

            Math.sin(
              u *
              Math.PI *
              2
            ) *

            curvature *
            .08;

          const pz =
            curvature *
            .68 *
            crown *
            (
              .22 +
              v *
              .92
            ) +

            fold;

          py +=
            Math.sin(
              v *
              Math.PI
            ) *
            thickness *
            .16;

          positions.push(
            px,
            py,
            pz
          );

          uvs.push(
            u,
            v
          );
        }
      }

      const row =
        horizontalSegments +
        1;

      for (
        let y = 0;
        y < verticalSegments;
        y++
      ) {

        for (
          let x = 0;
          x < horizontalSegments;
          x++
        ) {

          const a =
            y *
            row +
            x;

          const b =
            a +
            1;

          const c =
            a +
            row;

          const d =
            c +
            1;

          indices.push(
            a,
            c,
            b,

            b,
            c,
            d
          );
        }
      }

      const geometry =
        new THREE.BufferGeometry();

      geometry.setAttribute(

        "position",

        new THREE.Float32BufferAttribute(
          positions,
          3
        )
      );

      geometry.setAttribute(

        "uv",

        new THREE.Float32BufferAttribute(
          uvs,
          2
        )
      );

      geometry.setIndex(
        indices
      );

      geometry.computeVertexNormals();

      /*
        Custom vertex displacement.
        The petals are geometrically curved;
        animation later adds tiny organic deformation.
      */

      const shaderPatch =
        THREE.ShaderChunk;

      return geometry;
    }

    /* =========================================================
       PETAL LAYER
    ========================================================== */

    function createPetalLayer(
      config
    ) {

      const {
        count,
        radius,
        width,
        height,
        layer,
        tilt,
        delay,
        curvature,
        influence,
        stiffness,
        damping
      } = config;

      for (
        let i = 0;
        i < count;
        i++
      ) {

        const ratio =
          i /
          count;

        const angle =
          ratio *
          Math.PI *
          2 +
          layer *
          .47;

        const localRadius =
          radius +

          Math.sin(
            i *
            2.17 +
            layer
          ) *
          .03;

        const position =
          new THREE.Vector3(

            Math.sin(angle) *
              localRadius,

            2.97 +
              layer *
              .08 +
              Math.cos(
                i *
                1.7
              ) *
              .025,

            Math.cos(angle) *
              localRadius

          );

        const rotation =
          new THREE.Euler(

            tilt +
              Math.sin(
                i *
                1.3
              ) *
              .065,

            angle,

            Math.sin(
              i *
              2.1
            ) *
            .065

          );

        const scale =
          new THREE.Vector3(

            .95 +
              Math.sin(
                i *
                2.1
              ) *
              .05,

            .84 +
              Math.cos(
                i *
                1.7
              ) *
              .07,

            1

          );

        addPetal(

          {

            width,

            height,

            curvature,

            thickness:
              .032 +
              layer *
              .004,

            phase:
              i *
              .43 +
              layer *
              1.37,

            delay:
              delay +
              ratio *
              .045 +

              Math.sin(
                i *
                1.4
              ) *
              .015,

            duration:
              .14 +
              layer *
              .02 +
              (
                i %
                3
              ) *
              .007,

            influence,

            stiffness,

            damping,

            position,

            rotation,

            scale

          },

          layer,

          i

        );
      }
    }

    function makeMistTexture() {

      const canvas =
        document.createElement(
          "canvas"
        );

      canvas.width =
        256;

      canvas.height =
        128;

      const ctx =
        canvas.getContext(
          "2d"
        );

      const gradient =
        ctx.createRadialGradient(
          128,
          64,
          0,
          128,
          64,
          128
        );

      gradient.addColorStop(
        0,
        "rgba(255,255,255,.12)"
      );

      gradient.addColorStop(
        .35,
        "rgba(205,207,220,.07)"
      );

      gradient.addColorStop(
        .72,
        "rgba(180,185,205,.018)"
      );

      gradient.addColorStop(
        1,
        "rgba(180,185,205,0)"
      );

      ctx.fillStyle =
        gradient;

      ctx.fillRect(
        0,
        0,
        256,
        128
      );

      return new THREE.CanvasTexture(
        canvas
      );
    }

    const MIST_TEXTURE =
      makeMistTexture();

              .018 +
              (

              ) *
              .006,

            depthWrite:
              false

        const sprite =
          new THREE.Sprite(
            material
          );

        sprite.position.set(

          (
            i -
            count /
            2
          ) *
          5.3,

          .36 +
          (
            i % 3
          ) *
          .4,

          -7 -
          i *
          2.7

        );

        sprite.scale.set(
          18 +
          (
            i % 3
          ) *
          6,

          6 +
          (
            i % 2
          ) *
          2,

          1
        );

        sprite.userData = {

          phase:
            i *
            1.28,

          baseX:
            sprite.position.x,

          baseZ:
            sprite.position.z,

          speed:
            .08 +

            ) *

    function sampleCamera(
      progress
    ) {

      let A;
      let B;
      let t;

      if (
        progress <
        .20
      ) {

        A =
          SHOTS.extremeWide;

        B =
          SHOTS.wide;

        t =
          easeInOut(
            progress /
            .20
          );

      } else if (
        progress <
        .47
      ) {

        A =
          SHOTS.wide;

        B =
          SHOTS.approach;

        t =
          easeInOut(
            (
              progress -
              .20
            ) /
            .27
          );

      } else if (
        progress <
        .73
      ) {

        A =
          SHOTS.approach;

        B =
          SHOTS.macro;

        t =
          easeInOut(
            (
              progress -
              .47
            ) /
            .26
          );

      } else {

        A =
          SHOTS.macro;

        B =
          SHOTS.hero;

        t =
          easeInOut(
            (
              progress -
              .73
            ) /
            .27
          );
      }

      STATE.cameraPosition.lerpVectors(
        A.position,
        B.position,
        t
      );

      STATE.cameraLook.lerpVectors(
        A.look,
        B.look,
        t
      );
    }
