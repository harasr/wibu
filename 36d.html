    function initPostProcessing() {

      ENGINE.composer =
        new EffectComposer(
          ENGINE.renderer
        );

      ENGINE.renderPass =
        new RenderPass(
          ENGINE.scene,
          ENGINE.camera
        );

      ENGINE.composer.addPass(
        ENGINE.renderPass
      );


      ENGINE.bloomPass =
        new UnrealBloomPass(

          new THREE.Vector2(
            window.innerWidth,
            window.innerHeight
          ),

          QUALITY.tier === "high"
            ? .34
            : QUALITY.tier === "medium"
              ? .25
              : .18,

          .60,

          .88
        );

      ENGINE.composer.addPass(
        ENGINE.bloomPass
      );


      if (
        QUALITY.post
      ) {

        ENGINE.bokehPass =
          new BokehPass(

            ENGINE.scene,

            ENGINE.camera,

            {

              focus:
                25,

              aperture:
                .00002,

              maxblur:
                .012
            }

          );

        ENGINE.composer.addPass(
          ENGINE.bokehPass
        );
      }


      ENGINE.outputPass =
        new OutputPass();

      ENGINE.composer.addPass(
        ENGINE.outputPass
      );

      setLoading(
        .79,
        "preparing cinematic optics"
      );
    }


    /* =========================================================
       LOADING / BOOT
    ========================================================== */

    async function boot() {

      /*
        Critical fix:
        the loading renderer starts BEFORE expensive scene
        construction. Therefore the percentage can actually
        paint and advance.
      */

      renderLoading();

      await nextFrame();

      setLoading(
        .04,
        "preparing the garden"
      );

      initRenderer();

      await yieldToBrowser();

      initScene();

      await yieldToBrowser();

      initSky();

      await yieldToBrowser();

      initClouds();

      await yieldToBrowser();

      initLighting();

      await yieldToBrowser();

      initGround();

      initGrass();

      await yieldToBrowser();

      initParticles();

      await yieldToBrowser();

      initStem();

      initLeaves();

      await yieldToBrowser();

      initRose();

      await yieldToBrowser();

      initMist();

      await yieldToBrowser();

      initPostProcessing();

      await yieldToBrowser();

      handleResize();

      setLoading(
        .90,
        "warming the shaders"
      );

      /*
        Shader compile happens on next frame so the loading
        interface itself is not blocked before first paint.
      */

      await nextFrame();

      try {

        ENGINE.renderer.compile(
          ENGINE.scene,
          ENGINE.camera
        );

      } catch (
        compileError
      ) {

        console.warn(
          "[BLOOM] shader warm-up:",
          compileError
        );
      }

      setLoading(
        1,
        "the garden is awake"
      );

      await wait(
        520
      );

      finishLoading();

      STATE.autoPlay =
        true;
    }


    function nextFrame() {

      return new Promise(
        resolve => {

          requestAnimationFrame(
            () => resolve()
          );

        }
      );
    }


    function yieldToBrowser() {

      return new Promise(
        resolve => {

          setTimeout(
            resolve,
            20
          );

        }
      );
    }


    function wait(
      milliseconds
    ) {

      return new Promise(
        resolve =>
          setTimeout(
            resolve,
            milliseconds
          )
      );
    }


    /* =========================================================
       SKY UPDATE
    ========================================================== */

    const SKY = {

      top0:
        new THREE.Color(
          "#06101e"
        ),

      top1:
        new THREE.Color(
          "#14132b"
        ),

      top2:
        new THREE.Color(
          "#2d1a2b"
        ),

      top3:
        new THREE.Color(
          "#391923"
        ),

      mid0:
        new THREE.Color(
          "#253750"
        ),

      mid1:
        new THREE.Color(
          "#48364f"
        ),

      mid2:
        new THREE.Color(
          "#765362"
        ),

      mid3:
        new THREE.Color(
          "#906066"
        ),

      horizon0:
        new THREE.Color(
          "#3e4861"
        ),

      horizon1:
        new THREE.Color(
          "#704f66"
        ),

      horizon2:
        new THREE.Color(
          "#b86c6b"
        ),

      horizon3:
        new THREE.Color(
          "#d18d73"
        )
    };


    function updateSky(
      progress,
      dt
    ) {

      const top =
        WORLD.sky.material
          .uniforms
          .topColor
          .value;

      const mid =
        WORLD.sky.material
          .uniforms
          .middleColor
          .value;

      const horizon =
        WORLD.sky.material
          .uniforms
          .horizonColor
          .value;


      if (
        progress <
        .34
      ) {

        const t =
          easeInOut(
            progress /
            .34
          );

        top.lerpColors(
          SKY.top0,
          SKY.top1,
          t
        );

        mid.lerpColors(
          SKY.mid0,
          SKY.mid1,
          t
        );

        horizon.lerpColors(
          SKY.horizon0,
          SKY.horizon1,
          t
        );

      } else if (
        progress <
        .72
      ) {

        const t =
          easeInOut(
            (
              progress -
              .34
            ) /
            .38
          );

        top.lerpColors(
          SKY.top1,
          SKY.top2,
          t
        );

        mid.lerpColors(
          SKY.mid1,
          SKY.mid2,
          t
        );

        horizon.lerpColors(
          SKY.horizon1,
          SKY.horizon2,
          t
        );

      } else {

        const t =
          easeInOut(
            (
              progress -
              .72
            ) /
            .28
          );

        top.lerpColors(
          SKY.top2,
          SKY.top3,
          t
        );

        mid.lerpColors(
          SKY.mid2,
          SKY.mid3,
          t
        );

        horizon.lerpColors(
          SKY.horizon2,
          SKY.horizon3,
          t
        );
      }


      WORLD.sky.material
        .uniforms
        .horizonGlow
        .value =
        .23 +
        range(
          progress,
          .58,
          1
        ) *
        .28;


      WORLD.sky.material
        .uniforms
        .time
        .value =
        STATE.time;


      const atmospheric =
        range(
          STATE.cameraProgress,
          .18,
          .9
        );

      const fogTarget =
        THREE.MathUtils.lerp(
          .017,
          .0108,
          atmospheric
        );

      ENGINE.scene.fog.density =
        damp(
          ENGINE.scene.fog.density,
          fogTarget,
          2.2,
          dt
        );

      WORLD.horizon.material.opacity =
        .035 +
        range(
          progress,
          .55,
          1
        ) *
        .055;
    }


    /* =========================================================
       CLOUD UPDATE
    ========================================================== */

    function updateClouds(
      dt
    ) {

      WORLD.cloudGroup.children
        .forEach(
          cluster => {

            const d =
              cluster.userData;

            const speed =
              .008 +
              STATE.windStrength *
              .006;

            cluster.position.x +=
              speed *
              d.drift *
              dt;

            cluster.position.y +=
              Math.sin(
                STATE.time *
                .018 +
                d.phase
              ) *
              .001;

            cluster.rotation.z +=
              noise1D(
                STATE.time *
                .007 +
                d.phase
              ) *
              .00003;

            if (
              cluster.position.x >
              46
            ) {

              cluster.position.x =
                -46;
            }
          }
        );
    }


    /* =========================================================
       CAMERA UPDATE
    ========================================================== */

    function updateCamera(
      dt
    ) {

      sampleCamera(
        STATE.cameraProgress
      );

      const parallax =
        STATE.cameraProgress <
        .8
          ? .28
          : .12;

      STATE.cameraPosition.x +=
        STATE.pointer.x *
        parallax;

      STATE.cameraPosition.y -=
        STATE.pointer.y *
        parallax *
        .4;


      /*
        Hero orbit.
      */

      if (
        STATE.cameraProgress >
        .86
      ) {

        const hero =
          range(
            STATE.cameraProgress,
            .86,
            1
          );

        const orbit =
          Math.sin(
            STATE.time *
            .12
          ) *
          .065 *
          hero;

        STATE.cameraPosition.x +=
          orbit;

        STATE.cameraLook.x +=
          orbit *
          .28;
      }


      /*
        Very light user orbit.
      */

      const orbitStrength =
        STATE.cameraProgress >
        .72
          ? .55
          : .22;

      STATE.cameraPosition.x +=
        damp(
          0,
          STATE.orbit.x *
          orbitStrength,
          4,
          dt
        );

      STATE.cameraPosition.y +=
        damp(
          0,
          STATE.orbit.y *
          orbitStrength,
          4,
          dt
        );

      STATE.orbit.multiplyScalar(
        Math.exp(
          -1.7 *
          dt
        )
      );


      /*
        Real camera damping.
      */

      ENGINE.camera.position.x =
        damp(
          ENGINE.camera.position.x,
          STATE.cameraPosition.x,
          3.15,
          dt
        );

      ENGINE.camera.position.y =
        damp(
          ENGINE.camera.position.y,
          STATE.cameraPosition.y,
          3.15,
          dt
        );

      ENGINE.camera.position.z =
        damp(
          ENGINE.camera.position.z,
          STATE.cameraPosition.z,
          2.55,
          dt
        );


      STATE.smoothLook.x =
        damp(
          STATE.smoothLook.x,
          STATE.cameraLook.x,
          4.4,
          dt
        );

      STATE.smoothLook.y =
        damp(
          STATE.smoothLook.y,
          STATE.cameraLook.y,
          4.4,
          dt
        );

      STATE.smoothLook.z =
        damp(
          STATE.smoothLook.z,
          STATE.cameraLook.z,
          4.4,
          dt
        );

      ENGINE.camera.lookAt(
        STATE.smoothLook
      );


      /*
        Macro lens progression.
      */

      const macro =
        range(
          STATE.cameraProgress,
          .45,
          .92
        );

      ENGINE.camera.fov =
        damp(
          ENGINE.camera.fov,
          43 -
            macro *
            8.5,
          4,
          dt
        );

      ENGINE.camera.updateProjectionMatrix();


      if (
        ENGINE.bokehPass
      ) {

        ENGINE.bokehPass.uniforms
          .focus.value =
          THREE.MathUtils.lerp(
            29,
            4.8,
            smooth(
              STATE.cameraProgress
            )
          );

        ENGINE.bokehPass.uniforms
          .aperture.value =
          THREE.MathUtils.lerp(
            .000012,
            .000085,
            range(
              STATE.cameraProgress,
              .48,
              1
            )
          );
      }
    }


    /* =========================================================
       BLOOM / PETALS
    ========================================================== */

    function updateRose(
      progress,
      dt
    ) {

      const bloomStart =
        .57;

      const bloomEnd =
        .94;

      const bloom =
        progress <= bloomStart
          ? 0
          : smoothstep(
              (
                progress -
                bloomStart
              ) /
              (
                bloomEnd -
                bloomStart
              )
            );

      STATE.bloomProgress =
        bloom;


      /*
        Bud retreat.
      */

      const budOpen =
        range(
          bloom,
          .02,
          .30
        );

      WORLD.bud.scale.x =
        damp(
          WORLD.bud.scale.x,
          .88 -
            budOpen *
            .06,
          4,
          dt
        );

      WORLD.bud.scale.y =
        damp(
          WORLD.bud.scale.y,
          1.47 -
            budOpen *
            1.15,
          3.6,
          dt
        );

      WORLD.bud.scale.z =
        damp(
          WORLD.bud.scale.z,
          .82 -
            budOpen *
            .04,
          4,
          dt
        );


      /*
        Individual petal choreography.
      */

      for (
        let i = 0;
        i < ROSE.petals.length;
        i++
      ) {

        const petal =
          ROSE.petals[i];

        const data =
          petal.userData;

        const local =
          clamp01(
            (
              bloom -
              data.delay
            ) /
            data.duration
          );

        const opening =
          easeOut(
            local
          );

        const layer =
          data.layer;

        const spread = [
          .96,
          .73,
          .50,
          .28
        ][layer];

        const base =
          data.basePosition;

        const radius =
          Math.sqrt(
            base.x *
              base.x +

            base.z *
              base.z
          );

        let targetX =
          base.x;

        let targetZ =
          base.z;

        if (
          radius >
          .0001
        ) {

          targetX +=
            base.x /
            radius *
            spread *
            opening;

          targetZ +=
            base.z /
            radius *
            spread *
            opening;
        }

        const targetY =
          base.y +
          opening *
          (
            .21 +
            layer *
            .025
          );


        petal.position.x =
          damp(
            petal.position.x,
            targetX,
            7,
            dt
          );

        petal.position.y =
          damp(
            petal.position.y,
            targetY,
            7,
            dt
          );

        petal.position.z =
          damp(
            petal.position.z,
            targetZ,
            7,
            dt
          );


        /*
          Outer petals open wider.
          Inner petals remain more vertical.
        */

        const closedTilt = [
          .72,
          .61,
          .51,
          .45
        ][layer];

        const openedTilt = [
          .17,
          .13,
          .10,
          .075
        ][layer];


        const organic =
          Math.sin(
            STATE.time *
            .20 +
            data.phase
          );


        const desiredX =
          THREE.MathUtils.lerp(
            closedTilt,
            openedTilt,
            opening
          ) +
          organic *
          .008;


        /*
          Wind response:
          target → inertia → damped return.
        */

        const windNoise =
          fbm(
            STATE.time *
            .18 +
            data.phase *
            1.8
          );

        const gust =
          STATE.windStrength *
          data.influence;

        const windX =
          WIND.vector.z *
          gust *
          .23;

        const windZ =
          -WIND.vector.x *
          gust *
          .18;

        const windY =
          windNoise *
          gust *
          .025;


        data.windX =
          damp(
            data.windX,
            windX,
            data.stiffness,
            dt
          );

        data.windY =
          damp(
            data.windY,
            windY,
            data.stiffness,
            dt
          );

        data.windZ =
          damp(
            data.windZ,
            windZ,
            data.stiffness,
            dt
          );


        petal.rotation.x =
          damp(
            petal.rotation.x,
            desiredX +
            data.windX,
            4.7,
            dt
          );

        petal.rotation.y =
          damp(
            petal.rotation.y,
            data.baseRotation.y +
            data.windZ,
            3.9,
            dt
          );

        petal.rotation.z =
          damp(
            petal.rotation.z,
            data.baseRotation.z +
            data.windY,
            4.5,
            dt
          );


        /*
          Tiny living deformation.
        */

        const breathing =
          1 +
          Math.sin(
            STATE.time *
            .28 +
            data.phase
          ) *
          .006;

        petal.scale.x =
          damp(
            petal.scale.x,
            data.baseScale.x *
            breathing,
            4.4,
            dt
          );

        petal.scale.y =
          damp(
            petal.scale.y,
            data.baseScale.y *
            THREE.MathUtils.lerp(
              .96,
              1.01,
              opening
            ) *
            breathing,
            4.4,
            dt
          );
      }


      /*
        Core reveal.
      */

      const coreProgress =
        range(
          bloom,
          .61,
          .95
        );

      WORLD.core.scale.setScalar(
        THREE.MathUtils.lerp(
          .5,
          1,
          coreProgress
        )
      );

      WORLD.core.rotation.y +=
        dt *
        (
          .02 +
          coreProgress *
          .008
        );


      /*
        Full bloom breathing.
      */

      if (
        bloom >
        .88
      ) {

        const life =
          Math.sin(
            STATE.time *
            .37
          );

        WORLD.rose.position.y =
          life *
          .0018;

        WORLD.rose.rotation.z =
          Math.sin(
            STATE.time *
            .21
          ) *
          .005;

      } else {

        WORLD.rose.position.y =
          0;

        WORLD.rose.rotation.z =
          0;
      }


      /*
        Occasional falling petal.
      */

      if (
        bloom >
        .965 &&

        ROSE.falling.length === 0 &&

        Math.random() <
        dt *
        .014
      ) {

        spawnFallingPetal();
      }
    }


    /* =========================================================
       VEGETATION
    ========================================================== */

    function updateVegetation(
      dt
    ) {

      /*
        Stem.
      */

      WORLD.stemGroup.rotation.x =
        damp(
          WORLD.stemGroup.rotation.x,
          WIND.vector.z *
          .105,
          2.7,
          dt
        );

      WORLD.stemGroup.rotation.z =
        damp(
          WORLD.stemGroup.rotation.z,
          -WIND.vector.x *
          .075,
          2.7,
          dt
        );


      /*
        Leaves.
      */

      for (
        let i = 0;
        i < ROSE.leaves.length;
        i++
      ) {

        const leaf =
          ROSE.leaves[i];

        const data =
          leaf.userData;

        const noise =
          fbm(
            STATE.time *
            .22 +
            data.phase
          );

        const movement =
          STATE.windStrength *
          data.influence *
          (
            .18 +
            noise *
            .055
          );

        leaf.rotation.x =
          damp(
            leaf.rotation.x,
            data.baseX +
            WIND.vector.z *
            movement,
            data.stiffness,
            dt
          );

        leaf.rotation.y =
          damp(
            leaf.rotation.y,
            data.baseY +
            WIND.vector.x *
            movement *
            .18,
            data.stiffness,
            dt
          );

        leaf.rotation.z =
          damp(
            leaf.rotation.z,
            data.baseZ -
            WIND.vector.x *
            movement,
            data.stiffness,
            dt
          );
      }


      /*
        Grass.
      */

      for (
        let i = 0;
        i < WORLD.grassGroup.children.length;
        i++
      ) {

        const grass =
          WORLD.grassGroup.children[i];

        const data =
          grass.userData;

        const noise =
          fbm(
            STATE.time *
            .18 +
            data.phase
          );

        const target =
          data.base +

          STATE.windStrength *
          data.influence *

          (
            .6 +
            noise *
            .15
          );

        grass.rotation =
          damp(
            grass.rotation,
            target,
            2.25,
            dt
          );
      }
    }


    /* =========================================================
       PARTICLES UPDATE
    ========================================================== */

    function updateParticleSystem(
      system,
      dt
    ) {

      const {
        positions,
        velocities,
        phase,
        count,
        material,
        type
      } = system;

      for (
        let i = 0;
        i < count;
        i++
      ) {

        const i3 =
          i *
          3;

        const turbulence =
          fbm(
            STATE.time *
            .12 +
            phase[i]
          );

        velocities[i3] +=
          WIND.vector.x *
          .00055 *
          dt;

        velocities[i3 + 1] +=
          turbulence *
          .00002 *
          dt;

        velocities[i3 + 2] +=
          WIND.vector.z *
          .00055 *
          dt;

        const drag =
          Math.exp(
            -.16 *
            dt
          );

        velocities[i3] *=
          drag;

        velocities[i3 + 1] *=
          drag;

        velocities[i3 + 2] *=
          drag;

        positions[i3] +=
          velocities[i3] *
          dt *
          60;

        positions[i3 + 1] +=
          velocities[i3 + 1] *
          dt *
          60;

        positions[i3 + 2] +=
          velocities[i3 + 2] *
          dt *
          60;


        if (
          positions[i3] >
          19
        ) {
          positions[i3] =
            -19;
        }

        if (
          positions[i3] <
          -19
        ) {
          positions[i3] =
            19;
        }

        if (
          positions[i3 + 1] >
          15
        ) {
          positions[i3 + 1] =
            .3;
        }

        if (
          positions[i3 + 1] <
          .15
        ) {
          positions[i3 + 1] =
            14;
        }

        if (
          positions[i3 + 2] >
          34
        ) {
          positions[i3 + 2] =
            -34;
        }

        if (
          positions[i3 + 2] <
          -34
        ) {
          positions[i3 + 2] =
            34;
        }
      }

      system.points
        .geometry
        .attributes
        .position
        .needsUpdate =
        true;

      material.opacity =
        type === "dust"
          ? .25
          : .63 +
            range(
              STATE.progress,
              .56,
              1
            ) *
            .12;
    }


    /* =========================================================
       MIST UPDATE
    ========================================================== */

    function updateMist() {

      WORLD.mistGroup.children
        .forEach(
          sprite => {

            const data =
              sprite.userData;

            const noise =
              fbm(
                STATE.time *
                .045 +
                data.phase
              );

            sprite.position.x =
              data.baseX +

              Math.sin(
                STATE.time *
                data.speed +
                data.phase
              ) *
              1.5 +

              noise *
              2.2;

            sprite.position.z =
              data.baseZ +

              Math.cos(
                STATE.time *
                .025 +
                data.phase
              ) *
              .65;

            sprite.position.y =
              .32 +

              Math.sin(
                STATE.time *
                .05 +
                data.phase
              ) *
              .12;

            sprite.material.opacity =
              (
                .018 +
                (
                  data.phase *
                  1.7
                % 4) *
                .006
              ) *

              (
                .72 +
                STATE.windStrength *
                .28
              );
          }
        );
    }


    /* =========================================================
       DEW UPDATE
    ========================================================== */

    function updateDew() {

      for (
        let i = 0;
        i < ROSE.dew.length;
        i++
      ) {

        const drop =
          ROSE.dew[i];

        drop.material.opacity =
          .42 +

          Math.sin(
            STATE.time *
            .68 +
            drop.userData.phase
          ) *
          .06;
      }
    }


    /* =========================================================
       FALLING PETALS
    ========================================================== */

    function spawnFallingPetal() {

      const geometry =
        createPetalGeometry({

          width:
            .34,

          height:
            .48,

          curvature:
            .24,

          thickness:
            .028,

          horizontalSegments:
            7,

          verticalSegments:
            9
        });

      const material =
        new THREE.MeshPhysicalMaterial({

          color:
            "#9b1635",

          roughness:
            .65,

          clearcoat:
            .2,

          sheen:
            .24,

          sheenColor:
            "#ff6f7e",

          transparent:
            true,

          opacity:
            0,

          side:
            THREE.DoubleSide

        });

      const object =
        new THREE.Mesh(
          geometry,
          material
        );

      object.position.set(

        (
          Math.random() -
          .5
        ) *
        1.15,

        3.3 +
        Math.random() *
        .75,

        (
          Math.random() -
          .5
        ) *
        .8
      );

      object.rotation.set(
        Math.random(),
        Math.random() *
        Math.PI,
        Math.random()
      );

      const size =
        .62 +
        Math.random() *
        .45;

      object.scale.setScalar(
        size
      );

      object.userData = {

        life:
          0,

        maxLife:
          5.4 +
          Math.random() *
          2.6,

        velocity:
          new THREE.Vector3(

            (
              Math.random() -
              .5
            ) *
            .13,

            -.055 -
            Math.random() *
            .045,

            (
              Math.random() -
              .5
            ) *
            .1

          ),

        angular:
          new THREE.Vector3(

            .25 +
            Math.random() *
            .35,

            .2 +
            Math.random() *
            .3,

            .25 +
            Math.random() *
            .55

          )
      };

      ENGINE.scene.add(
        object
      );

      ROSE.falling.push(
        object
      );
    }


    function updateFallingPetals(
      dt
    ) {

      for (
        let i =
          ROSE.falling.length -
          1;

        i >= 0;

        i--
      ) {

        const object =
          ROSE.falling[i];

        const data =
          object.userData;

        data.life +=
          dt;

        const fadeIn =
          smoothstep(
            Math.min(
              data.life /
              .35,
              1
            )
          );

        const fadeOut =
          1 -

          smoothstep(
            Math.max(
              0,
              (
                data.life -
                data.maxLife +
                .8
              ) /
              .8
            )
          );

        object.material.opacity =
          fadeIn *
          fadeOut;

        data.velocity.y -=
          .005 *
          dt;

        data.velocity.x +=
          WIND.vector.x *
          .018 *
          dt;

        data.velocity.z +=
          WIND.vector.z *
          .018 *
          dt;

        data.velocity.multiplyScalar(
          Math.exp(
            -.52 *
            dt
          )
        );

        object.position.addScaledVector(
          data.velocity,
          dt
        );

        object.rotation.x +=
          data.angular.x *
          dt;

        object.rotation.y +=
          data.angular.y *
          dt;

        object.rotation.z +=
          data.angular.z *
          dt;

        if (
          data.life >
          data.maxLife ||

          object.position.y <
          -.4
        ) {

          ENGINE.scene.remove(
            object
          );

          object.geometry.dispose();
          object.material.dispose();

          ROSE.falling.splice(
            i,
            1
          );
        }
      }
    }


    /* =========================================================
       LIGHTING UPDATE
    ========================================================== */

    function updateLighting(
      progress,
      dt
    ) {

      const warm =
        range(
          progress,
          .60,
          1
        );

      const climax =
        range(
          progress,
          .78,
          1
        );


      WORLD.keyLight.color.lerp(
        new THREE.Color(
          "#ffd6c2"
        ),
        Math.min(
          1,
          dt *
          1.5
        )
      );


      WORLD.fillLight.color.lerp(
        new THREE.Color(
          "#9e86a4"
        ),
        Math.min(
          1,
          dt *
          1.5
        )
      );


      WORLD.rimLight.color.lerp(
        new THREE.Color(
          "#ffac8b"
        ),
        Math.min(
          1,
          dt *
          1.5
        )
      );


      WORLD.keyLight.intensity =
        THREE.MathUtils.lerp(
          1.48,
          2.55,
          warm
        );


      WORLD.fillLight.intensity =
        THREE.MathUtils.lerp(
          .48,
          .73,
          warm
        );


      WORLD.rimLight.intensity =
        THREE.MathUtils.lerp(
          7.5,
          15.5,
          climax
        );


      WORLD.bounceLight.intensity =
        THREE.MathUtils.lerp(
          .85,
          2.5,
          climax
        );


      ENGINE.renderer
        .toneMappingExposure =
        THREE.MathUtils.lerp(
          .96,
          1.15,
          range(
            progress,
            .54,
            1
          )
        );


      if (
        ENGINE.bloomPass
      ) {

        const base =
          QUALITY.tier === "high"
            ? .34
            : QUALITY.tier === "medium"
              ? .25
              : .18;

        ENGINE.bloomPass.strength =
          base +
          range(
            progress,
            .78,
            1
          ) *
          .09;
      }
    }


    /* =========================================================
       STATE UPDATE
    ========================================================== */

    function updateState(
      dt
    ) {

      const smoothing =
        REDUCED_MOTION
          ? 5.5
          : 2.8;

      STATE.progress =
        damp(
          STATE.progress,
          STATE.targetProgress,
          smoothing,
          dt
        );

      STATE.cameraProgress =
        smoothstep(
          STATE.progress
        );
    }


    /* =========================================================
       AUTOPLAY
    ========================================================== */

    function updateAutoplay() {

      if (
        !STATE.autoPlay
      ) {
        return;
      }

      const idle =
        performance.now() -
        STATE.lastInteraction;

      if (
        idle <
        2400
      ) {
        return;
      }

      if (
        STATE.progress <
        .998
      ) {

        STATE.targetProgress =
          clamp01(
            STATE.targetProgress +
            .000075
          );
      }
    }


    /* =========================================================
       UI
    ========================================================== */

    function updateUI() {

      const percent =
        Math.round(
          STATE.progress *
          100
        );

      DOM.progress.textContent =
        String(
          percent
        ).padStart(
          2,
          "0"
        ) +
        "%";

      if (
        STATE.progress >
        .035
      ) {

        DOM.hint.classList.add(
          "hidden"
        );

      } else {

        DOM.hint.classList.remove(
          "hidden"
        );
      }
    }


    /* =========================================================
       SCROLL INPUT
    ========================================================== */

    function readScroll() {

      const maxScroll =
        document.documentElement
          .scrollHeight -
        window.innerHeight;

      if (
        maxScroll <=
        0
      ) {

        STATE.targetProgress =
          0;

        return;
      }

      STATE.targetProgress =
        clamp01(
          window.scrollY /
          maxScroll
        );

      STATE.autoPlay =
        false;

      STATE.lastInteraction =
        performance.now();
    }


    window.addEventListener(
      "scroll",
      readScroll,
      {
        passive:
          true
      }
    );


    /* =========================================================
       POINTER INPUT
    ========================================================== */

    window.addEventListener(
      "pointermove",
      event => {

        STATE.pointerTarget.set(

          event.clientX /
            window.innerWidth *
            2 -
            1,

          event.clientY /
            window.innerHeight *
            2 -
            1
        );

        STATE.lastInteraction =
          performance.now();

        if (
          STATE.mouseDown
        ) {

          const dx =
            event.clientX -
            STATE.pointerDown.x;

          const dy =
            event.clientY -
            STATE.pointerDown.y;

          STATE.orbit.x +=
            dx *
            .00035;

          STATE.orbit.y +=
            dy *
            .00020;

          STATE.orbit.x =
            THREE.MathUtils.clamp(
              STATE.orbit.x,
              -.15,
              .15
            );

          STATE.orbit.y =
            THREE.MathUtils.clamp(
              STATE.orbit.y,
              -.09,
              .09
            );

          STATE.pointerDown.set(
            event.clientX,
            event.clientY
          );
        }
      },
      {
        passive:
          true
      }
    );


    window.addEventListener(
      "pointerdown",
      event => {

        STATE.mouseDown =
          event.pointerType ===
          "mouse";

        STATE.pointerDown.set(
          event.clientX,
          event.clientY
        );

        STATE.lastInteraction =
          performance.now();
      },
      {
        passive:
          true
      }
    );


    window.addEventListener(
      "pointerup",
      () => {

        STATE.mouseDown =
          false;

      },
      {
        passive:
          true
      }
    );


    window.addEventListener(
      "pointercancel",
      () => {

        STATE.mouseDown =
          false;

      },
      {
        passive:
          true
      }
    );


    window.addEventListener(
      "wheel",
      () => {

        STATE.autoPlay =
          false;

        STATE.lastInteraction =
          performance.now();

      },
      {
        passive:
          true
      }
    );


    /* =========================================================
       POINTER DAMP
    ========================================================== */

    function updatePointer(
      dt
    ) {

      STATE.pointer.x =
        damp(
          STATE.pointer.x,
          STATE.pointerTarget.x,
          4.2,
          dt
        );

      STATE.pointer.y =
        damp(
          STATE.pointer.y,
          STATE.pointerTarget.y,
          4.2,
          dt
        );
    }


    /* =========================================================
       RESIZE
    ========================================================== */

    function handleResize() {

      const width =
        window.innerWidth;

      const height =
        window.innerHeight;

      ENGINE.camera.aspect =
        width /
        height;

      ENGINE.camera.updateProjectionMatrix();

      ENGINE.renderer.setPixelRatio(
        QUALITY.dpr
      );

      ENGINE.renderer.setSize(
        width,
        height,
        false
      );

      ENGINE.composer.setSize(
        width,
        height
      );
    }


    window.addEventListener(
      "resize",
      handleResize
    );


    /* =========================================================
       RESET
    ========================================================== */

    function resetExperience() {

      window.scrollTo({
        top:
          0,
        behavior:
          "auto"
      });

      STATE.progress =
        0;

      STATE.targetProgress =
        0;

      STATE.cameraProgress =
        0;

      STATE.bloomProgress =
        0;

      STATE.autoPlay =
        false;

      STATE.orbit.set(
        0,
        0
      );

      STATE.lastInteraction =
        performance.now();


      /*
        Rose reset.
      */

      WORLD.bud.scale.set(
        .88,
        1.47,
        .82
      );

      WORLD.core.scale.setScalar(
        .5
      );

      WORLD.rose.position.y =
        0;

      WORLD.rose.rotation.z =
        0;


      for (
        let i = 0;
        i < ROSE.petals.length;
        i++
      ) {

        const petal =
          ROSE.petals[i];

        const data =
          petal.userData;

        petal.position.copy(
          data.basePosition
        );

        petal.rotation.copy(
          data.baseRotation
        );

        petal.scale.copy(
          data.baseScale
        );

        data.windX = 0;
        data.windY = 0;
        data.windZ = 0;
      }


      /*
        Remove falling petals.
      */

      for (
        let i =
          ROSE.falling.length -
          1;

        i >= 0;

        i--
      ) {

        const petal =
          ROSE.falling[i];

        ENGINE.scene.remove(
          petal
        );

        petal.geometry.dispose();
        petal.material.dispose();
      }

      ROSE.falling.length =
        0;
    }


    DOM.replay.addEventListener(
      "click",
      resetExperience
    );


    window.addEventListener(
      "keydown",
      event => {

        if (
          event.key.toLowerCase() ===
          "r"
        ) {

          resetExperience();
        }
      }
    );


    /* =========================================================
       MAIN FRAME
    ========================================================== */

    function frame() {

      requestAnimationFrame(
        frame
      );

      const raw =
        clock.getDelta();

      const dt =
        Math.min(
          raw,
          .035
        );

      STATE.delta =
        dt;

      STATE.time +=
        dt;


      updateAutoplay();

      updatePointer(
        dt
      );

      updateState(
        dt
      );

      updateWind(
        dt
      );

      updateSky(
        STATE.progress,
        dt
      );

      updateClouds(
        dt
      );

      updateRose(
        STATE.progress,
        dt
      );

      updateVegetation(
        dt
      );

      updateParticleSystem(
        WORLD.pollen,
        dt
      );

      updateParticleSystem(
        WORLD.dust,
        dt
      );

      updateMist();

      updateDew();

      updateFallingPetals(
        dt
      );

      updateLighting(
        STATE.progress,
        dt
      );

      updateCamera(
        dt
      );

      updateUI();


      if (
        ENGINE.composer
      ) {

        ENGINE.composer.render();

      } else if (
        ENGINE.renderer &&
        ENGINE.scene &&
        ENGINE.camera
      ) {

        ENGINE.renderer.render(
          ENGINE.scene,
          ENGINE.camera
        );
      }
    }


    /* =========================================================
       START
    ========================================================== */

    (async function start() {

      try {

        /*
          Start loading UI first.
          This is the important fix for the previous
          "0% không tải" issue.
        */

        renderLoading();

        await nextFrame();

        await boot();

        setLoading(
          1,
          "the garden is awake"
        );

        frame();

      } catch (
        error
      ) {

        console.error(
          "[BLOOM]",
          error
        );

        DOM.fallback.classList.add(
          "show"
        );

        DOM.loader.classList.remove(
          "done"
        );

        document.body.classList.remove(
          "loading"
        );
      }

    })();

  </script>
</body>
</html>
